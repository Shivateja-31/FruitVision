services:
  # Python FastAPI Backend with PyTorch + OpenCV
  - type: web
    name: fruitvision-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: FORCE_CPU
        value: "true"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
